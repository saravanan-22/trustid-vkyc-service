services:
  trustid-api:
    build: .
    container_name: trustid-vkyc-api
    ports:
      - "8000:8000"
    # Secrets (TRUSTID_API_KEYS, AUDIT_SIGNING_SECRET, WEBHOOK_SIGNING_SECRET)
    # come from .env; copy .env.example and fill it in first.
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: "2"
    volumes:
      - trustid-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  trustid-data:
