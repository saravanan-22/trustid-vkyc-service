version: "3.8"

services:
  trustid-api:
    build: .
    container_name: trustid-vkyc-api
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=TrustID VKYC Verification Service
      - DEFAULT_API_KEY=trustid_live_demo_key_2026
      - FACE_MATCH_THRESHOLD=0.70
      - PASSIVE_LIVENESS_THRESHOLD=0.65
      - DEEPFAKE_MAX_RISK_SCORE=0.40
    volumes:
      - trustid-data:/app/data
    restart: unless-stopped

volumes:
  trustid-data:
